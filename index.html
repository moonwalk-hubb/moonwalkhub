<title>Moonwalk Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: barra in alto, home con un elenco di script (testo a sinistra, anteprima dell'interfaccia a destra), pagina script con scheda tecnica, funzioni, comandi e codice. */
:root {
  --bg: #EDEFF4;
  --surface: #F8F9FB;
  --fg: #14171F;
  --muted: #566075;
  --line: #D3D8E2;
  --accent: #FF821E;
  --accent-ink: #B34700;
  --on-accent: #14171F;

  --code-bg: #12141C;
  --code-fg: #D9DEEA;
  --code-dim: #6B7488;
  --code-line: #232838;
  --code-key: #FF9A45;
  --code-str: #9BD58B;
  --code-num: #7CB7FF;
  --code-fn: #E6C77A;
  --code-api: #C5A3FF;

  --hub-bg: #101218;
  --hub-head: #181B24;
  --hub-card: #1C2029;
  --hub-off: #373E4E;
  --hub-track: #303646;
  --hub-text: #F0F5FF;
  --hub-sub: #A5AFC3;
  --hub-orange: #FF821E;

  --font-display: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1016;
    --surface: #161922;
    --fg: #EEF0F5;
    --muted: #9AA3B5;
    --line: #2A2F3D;
    --accent-ink: #FF9A45;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1016;
  --surface: #161922;
  --fg: #EEF0F5;
  --muted: #9AA3B5;
  --line: #2A2F3D;
  --accent-ink: #FF9A45;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.wrap {
  width: 100%;
  max-width: 1112px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Barra */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.01em; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-block; position: relative; }
.brand-mark::after { content: ""; position: absolute; left: 6px; right: 6px; top: 9px; height: 4px; background: var(--on-accent); border-radius: 2px; }
.top-note { color: var(--muted); font-size: 0.85rem; }

/* Home */
.hero { padding-block: 40px 36px; }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 16px; text-wrap: balance; }
.hero p { margin: 0; max-width: 54ch; color: var(--muted); font-size: 1.08rem; }

.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

.project {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 28px;
  padding: 24px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  text-decoration: none;
  transition: border-color .15s ease, transform .15s ease;
}
.project:hover { border-color: var(--accent); }
.project-main { min-width: 0; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.hot { color: var(--accent-ink); border-color: var(--accent); }
.project h2 { font-family: var(--font-display); font-size: clamp(1.7rem, 4vw, 2.3rem); line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
.project .sub { margin: -6px 0 0; color: var(--muted); font-size: 0.95rem; }
.project .desc { margin: 0; max-width: 52ch; }
.project .cta { margin-top: 6px; font-weight: 600; color: var(--accent-ink); }
.project-stage { min-width: 0; display: flex; justify-content: center; align-items: center; padding: 24px 12px; border-radius: 12px; background: repeating-linear-gradient(135deg, transparent 0 11px, color-mix(in srgb, var(--line) 55%, transparent) 11px 12px), var(--bg); border: 1px solid var(--line); }

@media (min-width: 860px) {
  .project { grid-template-columns: minmax(0, 1fr) minmax(0, 400px); padding: 28px; }
}

/* Anteprima interfaccia */
.mock { width: 100%; max-width: 340px; background: var(--hub-bg); border: 1.6px solid var(--hub-orange); border-radius: 12px; padding-bottom: 12px; color: var(--hub-text); font-family: var(--font-body); box-shadow: 0 18px 40px -18px rgba(0,0,0,.55); user-select: none; }
.mock-head { background: var(--hub-head); border-radius: 12px; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
.mock-bar { width: 4px; height: 22px; background: var(--hub-orange); border-radius: 4px; flex: none; }
.mock-title { flex: 1; min-width: 0; line-height: 1.15; }
.mock-title b { display: block; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.02em; }
.mock-title span { font-size: 0.68rem; color: var(--hub-sub); }
.mock-btn { width: 24px; height: 24px; border-radius: 6px; background: #242834; display: grid; place-items: center; font-size: 0.8rem; flex: none; }
.mock-btn.x { background: #B43737; }
.mock-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 8px 12px; padding: 3px; background: #161921; border-radius: 8px; }
.mock-tab { text-align: center; font-weight: 700; font-size: 0.7rem; padding: 6px 0; border-radius: 6px; color: #D2D7E1; letter-spacing: 0.03em; }
.mock-tab.on { background: var(--hub-orange); color: var(--hub-bg); }
.mock-rows { display: flex; flex-direction: column; gap: 5px; padding: 0 12px; }
.mock-row { background: var(--hub-card); border-radius: 8px; padding: 0 12px; min-height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.72rem; font-weight: 600; }
.mock-row.slider { flex-direction: column; align-items: stretch; justify-content: center; gap: 6px; padding: 7px 12px 9px; }
.mock-row .top2 { display: flex; justify-content: space-between; gap: 8px; }
.mock-row .val { color: #FF9632; font-weight: 700; }
.mock-sw { width: 34px; height: 18px; border-radius: 999px; background: var(--hub-off); position: relative; flex: none; }
.mock-sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
.mock-sw.on { background: var(--hub-orange); }
.mock-sw.on::after { left: auto; right: 3px; }
.mock-track { height: 7px; border-radius: 999px; background: var(--hub-track); overflow: hidden; }
.mock-track i { display: block; height: 100%; background: var(--hub-orange); border-radius: 999px; }

/* Pagina script */
.crumb { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
.crumb:hover { color: var(--fg); }
.detail-head { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; padding-block: 28px 44px; }
.detail-head h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.4rem, 7vw, 4rem); line-height: 1.02; letter-spacing: -0.02em; margin: 14px 0 10px; }
.detail-head .lead { margin: 0 0 24px; max-width: 54ch; color: var(--muted); font-size: 1.05rem; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin: 0; border-top: 1px solid var(--line); }
.facts div { padding: 14px 16px 14px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.facts dt { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; }
.facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
@media (min-width: 900px) {
  .detail-head { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; gap: 48px; }
}
.stage-detail { min-width: 0; display: flex; justify-content: center; padding: 28px 12px; border-radius: 14px; border: 1px solid var(--line); background: repeating-linear-gradient(135deg, transparent 0 11px, color-mix(in srgb, var(--line) 55%, transparent) 11px 12px), var(--surface); }

.section { padding-block: 8px 44px; }
.section h2 { font-family: var(--font-display); font-size: 1.5rem; letter-spacing: -0.01em; margin: 0 0 6px; }
.section .sec-note { margin: 0 0 22px; color: var(--muted); max-width: 60ch; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; }
@media (min-width: 760px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px; } }
.group h3 { margin: 0 0 4px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); }
.feat { list-style: none; padding: 0; margin: 0; }
.feat li { padding: 14px 0; border-bottom: 1px solid var(--line); }
.feat li:first-child { border-top: 1px solid var(--line); }
.feat b { display: block; font-weight: 600; }
.feat span { color: var(--muted); font-size: 0.95rem; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 0.95rem; }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
kbd { font-family: var(--font-mono); font-size: 0.82em; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Codice */
.code-card { border-radius: 14px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--code-line); }
.code-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--code-line); color: var(--code-dim); font-family: var(--font-mono); font-size: 0.8rem; }
.code-bar .file { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { font: inherit; font-family: var(--font-body); font-weight: 600; font-size: 0.85rem; border: 0; border-radius: 8px; padding: 8px 16px; background: var(--accent); color: var(--on-accent); cursor: pointer; flex: none; min-width: 92px; }
.btn:hover { filter: brightness(1.06); }
.code-scroll { overflow: auto; max-height: min(70vh, 680px); padding-block: 12px; }
.l { display: flex; min-width: 100%; width: max-content; font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.65; color: var(--code-fg); white-space: pre; tab-size: 4; }
.l .n { flex: none; width: 4.2ch; text-align: right; padding-right: 1.6ch; margin-left: 8px; color: var(--code-dim); user-select: none; }
.l .t { padding-right: 24px; }
.l .t:empty::before { content: " "; }
.hljs-keyword { color: var(--code-key); }
.hljs-string { color: var(--code-str); }
.hljs-number, .hljs-literal { color: var(--code-num); }
.hljs-built_in { color: var(--code-api); }
.hljs-title, .hljs-title.function_ { color: var(--code-fn); }
.hljs-comment { color: var(--code-dim); font-style: italic; }
.copy-fallback { position: fixed; left: -9999px; top: 0; opacity: 0; }

footer { padding-block: 36px 56px; color: var(--muted); font-size: 0.85rem; }

.mock-action { background: #262C3A; border-radius: 8px; min-height: 33px; display: grid; place-items: center; font-weight: 700; font-size: 0.72rem; color: #fff; }
.mock-pick { background: #222633; color: #FF9632; border-radius: 6px; padding: 4px 12px; font-weight: 700; font-size: 0.72rem; }
.project-list { display: flex; flex-direction: column; gap: 20px; }
@media (min-width: 1000px) { .cols.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; } }

[data-view] { display: none; }
[data-view].active { display: block; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#" aria-label="Moonwalk Hub, torna alla home"><span class="brand-mark" aria-hidden="true"></span>Moonwalk Hub</a>
    <span class="top-note" id="count-note"></span>
  </header>

  <main>
    <section data-view="home" class="active" id="view-home">
      <div class="hero">
        <h1>Gli script che ho scritto, in un posto solo.</h1>
        <p>Ogni script ha la sua pagina con descrizione, comandi e codice completo da copiare.</p>
      </div>
      <div class="list-head"><span class="label">Script</span><span class="label" id="count-label"></span></div>
      <div class="project-list" id="project-list"></div>
    </section>
    <div id="detail-views"></div>
  </main>

  <footer>Moonwalk Hub</footer>
</div>

<textarea class="copy-fallback" id="copy-fallback" tabindex="-1" aria-hidden="true" readonly></textarea>

  var NUM_WORDS = { 1: "una", 2: "due", 3: "tre", 4: "quattro" };

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function mockHTML(m) {
    var tabs = m.tabs.map(function (t, i) {
      return '<span class="mock-tab' + (i === (m.active || 0) ? ' on' : '') + '">' + t + '</span>';
    }).join("");
    var rows = m.rows.map(function (r) {
      if (r.k === "c") {
        return '<div class="mock-row"><span>' + r.label + '</span><span class="mock-pick">' + r.value + '</span></div>';
      }
      if (r.k === "b") {
        return '<div class="mock-action">' + r.label + '</div>';
      }
      if (r.k === "t") {
        return '<div class="mock-row"><span>' + r.label + '</span><span class="mock-sw' + (r.on ? ' on' : '') + '"></span></div>';
      }
      return '<div class="mock-row slider"><div class="top2"><span>' + r.label + '</span><span class="val">' + r.value + '</span></div>' +
        '<div class="mock-track"><i style="width:' + r.pct + '%"></i></div></div>';
    }).join("");
    return '<div class="mock" aria-hidden="true">' +
      '<div class="mock-head"><span class="mock-bar"></span>' +
      '<div class="mock-title"><b>' + m.title + '</b><span>' + m.sub + '</span></div>' +
      '<span class="mock-btn">-</span><span class="mock-btn x">×</span></div>' +
      '<div class="mock-tabs" style="grid-template-columns:repeat(' + m.tabs.length + ',1fr)">' + tabs + '</div>' +
      '<div class="mock-rows">' + rows + '</div></div>';
  }

  function tagsHTML(tags) {
    return '<div class="tags">' + tags.map(function (t, i) {
      return '<span class="tag' + (i === 0 ? ' hot' : '') + '">' + t + '</span>';
    }).join("") + '</div>';
  }

  function linesOf(id) { return CODES[id].replace(/\n$/, "").split("\n"); }

  function highlighted(lines) {
    try {
      if (window.hljs) {
        var res = window.hljs.highlight(lines.join("\n"), { language: "lua", ignoreIllegals: true }).value;
        var split = res.split("\n");
        if (split.length === lines.length) return split;
      }
    } catch (e) {}
    return lines.map(esc);
  }

  function codeHTML(lines) {
    var hl = highlighted(lines);
    var out = [];
    for (var i = 0; i < hl.length; i++) {
      out.push('<div class="l"><span class="n">' + (i + 1) + '</span><span class="t">' + hl[i] + '</span></div>');
    }
    return out.join("");
  }

  function groupHTML(g) {
    return '<div class="group"><h3>' + g.title + '</h3><ul class="feat">' + g.items.map(function (it) {
      return '<li><b>' + it[0] + '</b><span>' + it[1] + '</span></li>';
    }).join("") + '</ul></div>';
  }

  function detailHTML(s) {
    var lines = linesOf(s.id);
    var colsClass = s.groups.length >= 3 ? "cols three" : "cols";
    return '<section data-view="' + s.id + '" id="view-' + s.id + '">' +
      '<a class="crumb" href="#">← Tutti gli script</a>' +
      '<div class="detail-head"><div>' + tagsHTML(s.tags) +
      '<h1>' + s.name + '</h1><p class="lead">' + s.lead + '</p>' +
      '<dl class="facts">' +
      '<div><dt>Gioco</dt><dd>' + s.game + '</dd></div>' +
      '<div><dt>Piattaforma</dt><dd>Roblox</dd></div>' +
      '<div><dt>Linguaggio</dt><dd>Luau</dd></div>' +
      '<div><dt>Dimensione</dt><dd>' + lines.length + ' righe</dd></div>' +
      '</dl></div>' +
      '<div class="stage-detail">' + mockHTML(s.mock) + '</div></div>' +

      '<div class="section"><h2>Funzioni</h2>' +
      '<p class="sec-note">Divise nelle stesse ' + NUM_WORDS[s.groups.length] + ' schede del pannello.</p>' +
      '<div class="' + colsClass + '">' + s.groups.map(groupHTML).join("") + '</div></div>' +

      '<div class="section"><h2>Comandi</h2>' +
      '<p class="sec-note">Tasti usati dallo script mentre le funzioni sono attive.</p>' +
      '<div class="table-wrap"><table><thead><tr><th>Funzione</th><th>Tasti</th><th>Effetto</th></tr></thead><tbody>' +
      s.controls.map(function (c) { return '<tr><td>' + c[0] + '</td><td>' + c[1] + '</td><td>' + c[2] + '</td></tr>'; }).join("") +
      '</tbody></table></div></div>' +

      '<div class="section"><h2>Codice</h2>' +
      '<p class="sec-note">Script completo, pronto da copiare. I numeri di riga non vengono copiati.</p>' +
      '<div class="code-card"><div class="code-bar">' +
      '<span class="file">' + s.file + ' · ' + lines.length + ' righe</span>' +
      '<button class="btn" type="button" data-copy="' + s.id + '">Copia codice</button></div>' +
      '<div class="code-scroll" tabindex="0" role="region" aria-label="Codice dello script ' + s.name + '">' + codeHTML(lines) + '</div></div></div>' +
      '</section>';
  }

  function projectHTML(s) {
    return '<a class="project" href="#' + s.id + '">' +
      '<div class="project-main">' + tagsHTML(s.tags) +
      '<h2>' + s.name + '</h2><p class="sub">' + s.sub + '</p>' +

      '<div class="project-stage">' + mockHTML(s.mock) + '</div></a>';
  }

  var countText = SCRIPTS.length + " script";
  document.getElementById("count-note").textContent = countText;
  document.getElementById("count-label").textContent = countText;
  document.getElementById("project-list").innerHTML = SCRIPTS.map(projectHTML).join("");
  document.getElementById("detail-views").innerHTML = SCRIPTS.map(detailHTML).join("");

  /* Copia */
  var fallback = document.getElementById("copy-fallback");
  var timers = {};
  function flash(btn, text) {
    btn.textContent = text;
    clearTimeout(timers[btn.getAttribute("data-copy")]);
    timers[btn.getAttribute("data-copy")] = setTimeout(function () { btn.textContent = "Copia codice"; }, 2000);
  }
  function selectFallback(code) {
    fallback.value = code;
    fallback.style.left = "0";
    fallback.style.opacity = "1";
    fallback.removeAttribute("aria-hidden");
    fallback.focus();
    fallback.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    fallback.style.left = "-9999px";
    fallback.style.opacity = "0";
    fallback.setAttribute("aria-hidden", "true");
    return ok;
  }
  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest ? ev.target.closest("[data-copy]") : null;
    if (!btn) return;
    var code = CODES[btn.getAttribute("data-copy")];
    var done = function () { flash(btn, "Copiato"); };
    var failed = function () { flash(btn, selectFallback(code) ? "Copiato" : "Copia a mano"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, failed);
    } else {
      failed();
    }
  });

  /* Routing sull'hash */
  var ids = SCRIPTS.map(function (s) { return s.id; });
  function route() {
    var h = (location.hash || "").replace(/^#/, "");
    var name = ids.indexOf(h) >= 0 ? h : "home";
    Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function (v) {
      v.classList.toggle("active", v.getAttribute("data-view") === name);
    });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
